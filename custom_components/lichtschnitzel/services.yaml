set_parameter:
  target:
    entity:
      integration: lichtschnitzel
      domain: light
  fields:
    parameter:
      required: true
      example: Speed
      selector:
        text:
    value:
      required: true
      example: 1.5
      selector:
        object:

activate_scene:
  target:
    entity:
      integration: lichtschnitzel
      domain: select
  fields:
    index:
      example: 2
      selector:
        number:
          min: 0
          max: 15
          mode: box
    name:
      example: Abend
      selector:
        text:

notify:
  target:
    entity:
      integration: lichtschnitzel
      domain: light
  fields:
    pattern:
      default: flash
      selector:
        select:
          translation_key: pattern
          options:
            - flash
            - pulse
            - chase
            - solid
    rgb_color:
      example: [255, 160, 0]
      selector:
        color_rgb:
    brightness_pct:
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    duration:
      default: 3
      selector:
        number:
          min: 0
          max: 600
          step: 0.5
          unit_of_measurement: s
    period:
      selector:
        number:
          min: 0.1
          max: 60
          step: 0.1
          unit_of_measurement: s
    start:
      example: -6
      selector:
        number:
          min: -10000
          max: 10000
          mode: box
    length:
      example: 6
      selector:
        number:
          min: 0
          max: 10000
          mode: box

set_indicator:
  target:
    entity:
      integration: lichtschnitzel
      domain: light
  fields:
    id:
      required: true
      example: waschmaschine
      selector:
        text:
    pattern:
      default: solid
      selector:
        select:
          translation_key: pattern
          options:
            - flash
            - pulse
            - chase
            - solid
    rgb_color:
      example: [0, 120, 255]
      selector:
        color_rgb:
    brightness_pct:
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    progress:
      example: 40
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    start:
      example: 0
      selector:
        number:
          min: -10000
          max: 10000
          mode: box
    length:
      example: 3
      selector:
        number:
          min: 0
          max: 10000
          mode: box
    priority:
      example: 1
      selector:
        number:
          min: -100
          max: 100
          mode: box
    period:
      selector:
        number:
          min: 0.1
          max: 60
          step: 0.1
          unit_of_measurement: s
    duration:
      selector:
        number:
          min: 0
          max: 600
          step: 1
          unit_of_measurement: s

clear_indicator:
  target:
    entity:
      integration: lichtschnitzel
      domain: light
  fields:
    id:
      example: waschmaschine
      selector:
        text:
